      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;

      transition: background-color 0.08s ease;
    }
    .safe-bottom {
      padding-bottom: max(1rem, env(safe-area-inset-bottom));

  </style>
</head>

            <path d="M9 12l2 2 4-4"></path>

          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

    <!-- Progress bar -->

      en: {

        fail: 'FAIL',
        skip: 'SKIP / N/A',

        displayDesc: 'Launch full-screen 6-color cycle (White, Black, Red, Green, Blue, Gray) to spot dead pixels or OLED burn-in.',
        openDisplayBtn: 'Launch 6-Color Display Test',
        touchTitle: 'Step 2: Full-Screen Multi-Touch Grid (45 Cells)',
        touchDesc: 'Drag across every cell. If a dead strip exists, tap the persistent "Mark Fail" button at the top anytime.',
        openTouchBtn: 'Launch Touch Grid',
        audioTitle: 'Step 3: Speakers & Microphone',
        audioDesc: 'Play real synthesized tones via Web Audio API and measure live microphone dB levels.',
        cameraTitle: 'Step 4: Front & Rear Cameras',
        cameraDesc: 'Verify live camera preview, focus sharpness, and lens cleanliness.',
        sensorTitle: 'Step 5: Sensors, Connectivity & iOS Hardware',
        sensorDesc: 'Tests Gyroscope, GPS, and Wi-Fi via browser APIs, plus honest manual checks for Safari-restricted iOS hardware.',
        cosmeticTitle: 'Step 6: Cosmetic Grading (4-Tier A/B/C/D)',
        cosmeticDesc: 'Explicit selection required for all 3 areas (no pre-filled defaults).',
        resultTitle: 'Inspection Summary & Export',
        newCheckBtn: 'Inspect Next Device',
        copyJsonBtn: 'Copy Full JSON',
        settingsTitle: '6-Digit Sync Webhook Settings',
        savedToast: 'Settings saved',
        copiedToast: 'Copied to clipboard',
      }
    };

    const CATALOG_IDS = [
      'device_identity', 'root_jailbreak',
      'display_uniformity', 'touch_grid',
      'earpiece_speaker', 'loudspeaker', 'microphone_loopback',
      'camera_front', 'camera_rear_wide', 'camera_rear_aux', 'camera_flash',
      'biometrics', 'proximity', 'accelerometer', 'gyroscope', 'barometer',
      'wifi', 'bluetooth', 'gps', 'nfc', 'sim_radio',
      'volume_buttons', 'haptics_vibration', 'battery_charging'
    ];

    const MANUAL_IOS_ITEMS = [
      { id: 'earpiece_speaker', th: 'ลำโพงสนทนา (Earpiece)', en: 'Earpiece Speaker', optional: false },
      { id: 'biometrics', th: 'Face ID / Touch ID (ฮาร์ดแวร์พร้อมใช้งาน)', en: 'Face ID / Touch ID Readiness', optional: false },
      { id: 'proximity', th: 'เซนเซอร์แนบหู (Proximity)', en: 'Proximity Sensor', optional: false },
      { id: 'volume_buttons', th: 'ปุ่มเพิ่ม-ลดเสียง และปุ่มปิดเสียง/Action', en: 'Volume & Mute/Action Buttons', optional: false },
      { id: 'haptics_vibration', th: 'ระบบสั่น (Taptic Engine)', en: 'Taptic Engine / Vibration', optional: false },
      { id: 'battery_charging', th: 'พอร์ตชาร์จ (เสียบสายแล้วไฟเข้า)', en: 'Charging Port Detection', optional: false },
      { id: 'bluetooth', th: 'Bluetooth (เปิดและค้นหาอุปกรณ์เจอ)', en: 'Bluetooth Radio', optional: false },
      { id: 'sim_radio', th: 'ถาดซิม / สัญญาณมือถือ (ไม่บังคับ — โหมดไร้ซิม)', en: 'SIM / Cellular (Optional Zero-SIM)', optional: true },
      { id: 'nfc', th: 'NFC / Apple Pay (ไม่บังคับ)', en: 'NFC Reader (Optional)', optional: true },
    ];

    const state = {
      lang: 'th',
      step: 'home', // home | display | touch | audio | camera | sensors | cosmetic | result
      webhookUrl: '',
      sessionId: '',
      startedAt: '',
      deviceInfo: detectDeviceInfo(),
      results: {},
      cosmetic: {
        screen: null,
        body: null,
        cameraGlass: null,
        liquidIndicatorTriggered: false,
        nonOemPartWarning: false,
      },
      manualImeiOrSerial: '',
      notes: '',
      cameraStream: null,
      cameraFacing: 'environment',
      micPeakDb: null,
      micActive: false,
      gyroSample: null,
      gpsSample: null,
      syncState: { loading: false, code: null, error: null },
      qrString: '',
    };

    try {
      const savedUrl = localStorage.getItem('smartcheck_webhook_url');
      if (savedUrl) state.webhookUrl = savedUrl;
    } catch (_) {}

    function detectDeviceInfo() {
      const ua = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const iosMatch = ua.match(/OS (\d+[_.\d]+)/);
      const osVersion = iosMatch ? iosMatch[1].replace(/_/g, '.') : (navigator.platform || 'Web');
      const dpr = window.devicePixelRatio || 1;
      const w = window.screen ? window.screen.width : 0;
      const h = window.screen ? window.screen.height : 0;
      return {
        os: isIOS ? 'iOS-Web' : 'Web',
        osVersion,
        model: isIOS ? `iPhone (${w}x${h}@${dpr}x)` : `Browser (${w}x${h})`,
        ramMb: (navigator.deviceMemory || 0) * 1024,
        storageGb: 0,
        isRootedOrJailbroken: false,
      };
    }

    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || key;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function resetSession() {
      stopCameraStream();
      state.sessionId = 'SC-' + Date.now().toString(36).toUpperCase();
      state.startedAt = new Date().toISOString();
      state.deviceInfo = detectDeviceInfo();
      state.results = {
        device_identity: { status: 'pass', detail: `${state.deviceInfo.model} / ${state.deviceInfo.osVersion}` },
        root_jailbreak: { status: 'notSupported', detail: 'web_sandbox_unreadable' },
        barometer: { status: 'notSupported', detail: 'safari_web_api_unavailable' },
        wifi: { status: navigator.onLine ? 'pass' : 'skipped', detail: navigator.onLine ? 'online' : 'offline' },
        sim_radio: { status: 'skipped', detail: 'zero_sim_mode' },
        nfc: { status: 'skipped', detail: 'optional_web' },
      };
      state.cosmetic = {
        screen: null,
        body: null,
        cameraGlass: null,
        liquidIndicatorTriggered: false,
        nonOemPartWarning: false,
      };
      state.manualImeiOrSerial = '';
      state.notes = '';
      state.micPeakDb = null;
      state.gyroSample = null;
      state.gpsSample = null;
      state.syncState = { loading: false, code: null, error: null };
      state.qrString = '';
    }

    function setResult(id, status, detail = '') {
      state.results[id] = { status, detail, completedAt: new Date().toISOString() };
    }

    function getCounts() {
      let pass = 0, fail = 0, skip = 0;
      for (const id of CATALOG_IDS) {
        const s = state.results[id]?.status || 'pending';
        if (s === 'pass') pass++;
        else if (s === 'fail') fail++;
        else if (s === 'skipped' || s === 'notSupported') skip++;
      }
      return { pass, fail, skip };
    }

    function computeOverallGrade() {
      const { fail } = getCounts();
      if (fail > 0 || state.cosmetic.liquidIndicatorTriggered) return 'D';
      const rank = { A: 0, B: 1, C: 2, D: 3 };
      const tiers = [state.cosmetic.screen, state.cosmetic.body, state.cosmetic.cameraGlass];
      if (tiers.some((x) => !x)) return 'A';
      const worst = Math.max(...tiers.map((x) => rank[x] ?? 3));
      return ['A', 'B', 'C', 'D'][worst];
    }

    function packedStatusString() {
      const map = { pass: 'P', fail: 'F', skipped: 'S', notSupported: 'N', pending: '-' };
      return CATALOG_IDS.map((id) => map[state.results[id]?.status || 'pending'] || '-').join('');
    }

    function buildFullJson() {
      const counts = getCounts();
      return {
        schemaVersion: 1,
        sessionId: state.sessionId,
        startedAt: state.startedAt,
        overallGrade: computeOverallGrade(),
        summary: {
          pass: counts.pass,
          fail: counts.fail,
          skippedOrUnsupported: counts.skip,
          failedIds: CATALOG_IDS.filter((id) => state.results[id]?.status === 'fail'),
        },
        deviceInfo: {
          ...state.deviceInfo,
          manualImeiOrSerial: state.manualImeiOrSerial || undefined,
        },
        results: state.results,
        cosmetic: state.cosmetic,
        notes: state.notes || undefined,
      };
    }

    // Simple deterministic 32-bit FNV/DJB2 + WebCrypto SHA-256 checksum
    async function computeShortSig(obj) {
      const sorted = {};
      Object.keys(obj).sort().forEach((k) => { sorted[k] = obj[k]; });
      const text = JSON.stringify(sorted);
      if (window.crypto && window.crypto.subtle) {
        try {
          const buf = new TextEncoder().encode(text);
          const hashBuf = await crypto.subtle.digest('SHA-256', buf);
          return Array.from(new Uint8Array(hashBuf))
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('')
            .slice(0, 8);
        } catch (_) {}
      }
      let h = 2166136261;
      for (let i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(16).padStart(8, '0');
    }

    function base64UrlEncode(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      bytes.forEach((b) => { bin += String.fromCharCode(b); });
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function encodeQrPayload() {
      const c = state.cosmetic;
      const compactCosmetic = c.screen
        ? `${c.screen}${c.body}${c.cameraGlass}${c.liquidIndicatorTriggered ? '1' : '0'}${c.nonOemPartWarning ? '1' : '0'}`
        : undefined;
      const payload = {
        v: 1,
        id: state.sessionId,
        ts: Math.floor(Date.parse(state.startedAt || new Date().toISOString()) / 1000),
        os: `${state.deviceInfo.os}/${state.deviceInfo.osVersion}`,
        m: state.deviceInfo.model,
        g: computeOverallGrade(),
        r: packedStatusString(),
      };
      if (state.manualImeiOrSerial) payload.sn = state.manualImeiOrSerial.slice(0, 24);
      if (compactCosmetic) payload.c = compactCosmetic;
      if (state.notes) payload.n = state.notes.trim().slice(0, 60);

      const sig = await computeShortSig(payload);
      const encoded = 'SC1:' + base64UrlEncode(JSON.stringify({ ...payload, sig }));
      return encoded.length <= 1000 ? encoded : encoded.slice(0, 1000);
    }

    function stopCameraStream() {
      if (state.cameraStream) {
        state.cameraStream.getTracks().forEach((tr) => tr.stop());
        state.cameraStream = null;
      }
    }

    function updateProgress() {
      const order = ['display', 'touch', 'audio', 'camera', 'sensors', 'cosmetic', 'result'];
      const wrap = document.getElementById('progressWrap');
      const idx = order.indexOf(state.step);
      if (idx === -1) {
        wrap.classList.add('hidden');
        return;
      }
      wrap.classList.remove('hidden');
      const pct = Math.round(((idx + 1) / order.length) * 100);
      document.getElementById('stepLabel').textContent = `Step ${idx + 1} / ${order.length}`;
      document.getElementById('progressPct').textContent = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function statusBadge(status) {
      const styles = {
        pass: 'bg-emerald-100 text-emerald-800',

    function launchTouchGrid() {
      const cols = 5, rows = 9, total = cols * rows;
      const touched = new Set();
      const ov = document.getElementById('fullscreenOverlay');
      ov.style.backgroundColor = '#ffffff';
      ov.classList.remove('hidden');

      let cellsHtml = '';
      for (let i = 0; i < total; i++) {
        cellsHtml += `<div data-cell="${i}" class="touch-grid-cell bg-slate-100 border border-white"></div>`;
      }
      ov.innerHTML = `
        <div id="touchBoard" class="w-full h-full grid grid-cols-5 grid-rows-9 touch-none relative">
          ${cellsHtml}
          <div class="fixed top-3 left-3 right-3 flex items-center justify-between pointer-events-none z-10">
            <span id="touchCounter" class="px-3 py-1.5 rounded-full bg-white/95 shadow text-xs font-bold text-slate-800">0 / ${total}</span>
            <button id="touchEscapeFail" type="button" class="pointer-events-auto px-3.5 py-1.5 rounded-full bg-rose-600 text-white shadow text-xs font-bold">
              ทัชไม่ติด (FAIL)
            </button>
          </div>
        </div>
      `;

      const board = document.getElementById('touchBoard');
      const counter = document.getElementById('touchCounter');

      function markAt(clientX, clientY) {
        const el = document.elementFromPoint(clientX, clientY);
        if (el && el.dataset && el.dataset.cell !== undefined) {
          const idx = el.dataset.cell;
          if (!touched.has(idx)) {
            touched.add(idx);
            el.classList.remove('bg-slate-100');
            el.classList.add('bg-emerald-500');
            counter.textContent = `${touched.size} / ${total}`;
            if (touched.size >= total) {
              setResult('touch_grid', 'pass', `all_${total}_cells_touched`);
              ov.classList.add('hidden');
              ov.innerHTML = '';
              render();
            }
          }
        }
      }

      board.addEventListener('pointerdown', (e) => {
        if (e.target.id === 'touchEscapeFail') return;
        markAt(e.clientX, e.clientY);
      });
      board.addEventListener('pointermove', (e) => {
        if (e.buttons > 0 || e.pointerType === 'touch') {
          markAt(e.clientX, e.clientY);
        }
      });
      document.getElementById('touchEscapeFail').addEventListener('click', () => {
        setResult('touch_grid', 'fail', `touched_${touched.size}_of_${total}`);
        ov.classList.add('hidden');
        ov.innerHTML = '';
        render();
      });
    }

    function playWebTone(freqHz, durationMs) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freqHz;
        gain.gain.value = 0.25;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => {
          osc.stop();
          ctx.close();
        }, durationMs);
      } catch (e) {
        showToast('Audio playback blocked');
      }
    }

    async function measureWebMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('Browser does not expose microphone API');
        return;
      }
      state.micActive = true;
      render();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        src.connect(analyser);
        const buf = new Float32Array(analyser.fftSize);
        let peak = -90;
        const end = Date.now() + 1400;
        while (Date.now() < end) {
          analyser.getFloatTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
          const rms = Math.sqrt(sum / buf.length);
          const db = rms > 0 ? 20 * Math.log10(rms) : -90;
          if (db > peak) peak = db;
          await new Promise((r) => setTimeout(r, 60));
        }
        stream.getTracks().forEach((tr) => tr.stop());
        ctx.close();
        state.micPeakDb = peak;
        setResult('microphone_loopback', peak > -45 ? 'pass' : 'fail', `peak_${peak.toFixed(1)}dB`);
      } catch (e) {
        showToast('Microphone permission denied or unavailable');
      } finally {
        state.micActive = false;
        render();
      }
    }

    async function testGyroAndAccel() {
      try {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const perm = await DeviceMotionEvent.requestPermission();
          if (perm !== 'granted') {
            showToast('Motion permission not granted');
            return;
          }
        }
        let gotData = false;
        const handler = (ev) => {
          const a = ev.accelerationIncludingGravity;
          const r = ev.rotationRate;
          if (a && (a.x !== null || a.y !== null)) {
            gotData = true;
            state.gyroSample = `Acc(${(a.x || 0).toFixed(1)}, ${(a.y || 0).toFixed(1)}) Rot(${(r?.alpha || 0).toFixed(0)})`;
            setResult('accelerometer', 'pass', state.gyroSample);
            setResult('gyroscope', 'pass', state.gyroSample);
            window.removeEventListener('devicemotion', handler);
            render();
          }
        };
        window.addEventListener('devicemotion', handler);
        setTimeout(() => {
          if (!gotData) {
            window.removeEventListener('devicemotion', handler);
            showToast('ไม่พบสัญญาณ Motion (ลองขยับเครื่อง iPhone)');
          }
        }, 2500);
      } catch (e) {
        showToast('Motion sensor requires HTTPS on iOS Safari');
      }
    }

      if (!navigator.geolocation) {
        setResult('gps', 'notSupported', 'no_geolocation');

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          state.gpsSample = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)} (±${Math.round(pos.coords.accuracy)}m)`;
          setResult('gps', 'pass', state.gpsSample);
          render();
        },
        () => {
          showToast('GPS denied or unavailable');
        },
        { timeout: 6000 }
      );
    }

            <p class="text-sm text-slate-600">${t('sensorDesc')}</p>

            <div class="p-3.5 rounded-xl bg-blue-50/70 border border-blue-200 space-y-2">
              <div class="text-xs font-bold text-blue-900">ตรวจอัตโนมัติผ่าน Safari API</div>
              <div class="grid grid-cols-2 gap-2">
                <button id="testMotionBtn" type="button" class="py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">ทดสอบ Gyro / Accel</button>
                <button id="testGpsBtn" type="button" class="py-2 rounded-lg bg-blue-600 text-white text-xs font-bold">ทดสอบ GPS</button>
              </div>
              ${state.gyroSample ? `<div class="text-[11px] text-blue-800">Motion: ${state.gyroSample}</div>` : ''}
              ${state.gpsSample ? `<div class="text-[11px] text-blue-800">GPS: ${state.gpsSample}</div>` : ''}
              <div class="divide-y divide-blue-100">
                ${quickRow('accelerometer', 'Accelerometer (จับความเอียง)', accel, false)}
                ${quickRow('gyroscope', 'Gyroscope (หมุนจอ)', gyro, false)}
                ${quickRow('gps', 'GPS / Location', gps, true)}
              </div>
            </div>

            <div class="pt-1">
              <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">เช็กลิสต์ฮาร์ดแวร์ iPhone (ช่างยืนยันผลจริง)</div>
              <div class="divide-y divide-slate-100">
                ${MANUAL_IOS_ITEMS.map((item) => quickRow(item.id, state.lang === 'th' ? item.th : item.en, state.results[item.id]?.status, item.optional)).join('')}
              </div>
            </div>
          </div>
          ${navFooter('camera', 'cosmetic', !allRequiredDone)}
        </div>
      `;
      document.getElementById('testMotionBtn').addEventListener('click', testGyroAndAccel);
      document.getElementById('testGpsBtn').addEventListener('click', testGps);
      bindQuickRows(main);
      bindNavFooter('camera', 'cosmetic');
    }

    function renderCosmetic(main) {
      const c = state.cosmetic;
      const canFinish = Boolean(c.screen && c.body && c.cameraGlass);

      function tierGroup(field, label) {
        const tiers = [
          { v: 'A', label: 'A สวย' },
          { v: 'B', label: 'B รอยน้อย' },
          { v: 'C', label: 'C รอยชัด' },
          { v: 'D', label: 'D แตก/บุบ' },
        ];
        return `
          <div class="space-y-1.5">
            <div class="text-xs font-bold text-slate-800">${label}</div>
            <div class="grid grid-cols-4 gap-1.5">
              ${tiers.map((ti) => {
                const active = c[field] === ti.v;
                return `<button data-tier-field="${field}" data-tier-val="${ti.v}" type="button" class="py-2 rounded-xl text-xs font-bold border transition ${active ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">${ti.label}</button>`;
              }).join('')}
            </div>
          </div>
        `;
      }

      main.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
            <div>
              <h2 class="text-base font-bold text-slate-900">${t('cosmeticTitle')}</h2>
              <p class="text-xs text-slate-500 mt-0.5">${t('cosmeticDesc')}</p>
            </div>

            ${tierGroup('screen', '1. สภาพกระจกหน้าจอ (Screen Glass)')}
            ${tierGroup('body', '2. สภาพบอดี้และฝาหลัง (Body & Frame)')}
            ${tierGroup('cameraGlass', '3. สภาพกระจกเลนส์กล้อง (Camera Glass)')}

            <div class="border-t border-slate-100 pt-3 space-y-2.5">
              <label class="flex items-center justify-between gap-3 text-xs font-semibold text-slate-800">
                <span>แถบวัดความชื้นเปลี่ยนสี (Liquid Damage)</span>
                <input id="liquidToggle" type="checkbox" ${c.liquidIndicatorTriggered ? 'checked' : ''} class="w-5 h-5 accent-rose-600" />
              </label>
              <label class="flex items-center justify-between gap-3 text-xs font-semibold text-slate-800">
                <span>พบแจ้งเตือนอะไหล่เทียบ / True Tone หาย</span>
                <input id="nonOemToggle" type="checkbox" ${c.nonOemPartWarning ? 'checked' : ''} class="w-5 h-5 accent-amber-600" />
              </label>
            </div>

            <div class="space-y-2.5 pt-1">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">IMEI / Serial Number (ไม่บังคับ)</label>
                <input id="imeiInput" type="text" value="${escapeHtml(state.manualImeiOrSerial)}" placeholder="กรอก IMEI หรือ Serial จาก Settings > About" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">หมายเหตุช่างเพิ่มเติม (สูงสุด 120 ตัวอักษร)</label>
                <input id="notesInput" type="text" maxlength="120" value="${escapeHtml(state.notes)}" placeholder="เช่น รอยขนแมวมุมล่างขวา, แบต 86%" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm" />
              </div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <button id="cosBackBtn" type="button" class="py-3.5 rounded-xl bg-slate-200 text-slate-800 font-bold text-sm">${t('backBtn')}</button>
            <button id="finishGradingBtn" type="button" ${canFinish ? '' : 'disabled'} class="col-span-2 py-3.5 rounded-xl bg-blue-600 text-white font-bold text-sm disabled:opacity-40">
              สรุปผลและสร้าง QR / โค้ด 6 หลัก →
            </button>
          </div>
        </div>
      `;

      main.querySelectorAll('[data-tier-field]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.cosmetic[btn.dataset.tierField] = btn.dataset.tierVal;
          render();
        });
      });
      document.getElementById('liquidToggle').addEventListener('change', (e) => {
        state.cosmetic.liquidIndicatorTriggered = e.target.checked;
      });
      document.getElementById('nonOemToggle').addEventListener('change', (e) => {
        state.cosmetic.nonOemPartWarning = e.target.checked;
      });
      document.getElementById('imeiInput').addEventListener('input', (e) => {
        state.manualImeiOrSerial = e.target.value;
      });
      document.getElementById('notesInput').addEventListener('input', (e) => {
        state.notes = e.target.value;
      });
      document.getElementById('cosBackBtn').addEventListener('click', () => {
        state.step = 'sensors';
        render();
      });
      document.getElementById('finishGradingBtn').addEventListener('click', async () => {
        state.step = 'result';
        state.qrString = await encodeQrPayload();
        render();
        syncSixDigitCode();
      });
    }

    async function syncSixDigitCode() {
      const url = (state.webhookUrl || '').trim();
      if (!url || !url.startsWith('https://')) {
        state.syncState = { loading: false, code: null, error: 'ยังไม่ได้ตั้งค่า HTTPS Webhook (ใช้ QR ออฟไลน์ด้านล่างได้ทันที)' };
        if (state.step === 'result') render();
        return;
      }
      state.syncState = { loading: true, code: null, error: null };
      if (state.step === 'result') render();
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(buildFullJson()),
          signal: controller.signal,
        });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data && /^\d{6}$/.test(String(data.code || ''))) {
          state.syncState = { loading: false, code: String(data.code), error: null };
        } else {
          throw new Error('Invalid 6-digit code in response');
        }
      } catch (err) {
        state.syncState = { loading: false, code: null, error: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ (สแกน QR ออฟไลน์ได้ทันที)' };
      }
      if (state.step === 'result') render();
    }

    function renderResult(main) {
      const grade = computeOverallGrade();
      const counts = getCounts();
      const gradeColor = grade === 'D' ? 'bg-rose-600' : (grade === 'C' ? 'bg-amber-500' : 'bg-emerald-600');
      const sync = state.syncState;

      main.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center gap-4">
            <div class="w-16 h-16 rounded-2xl ${gradeColor} text-white flex flex-col items-center justify-center shrink-0">
              <span class="text-[10px] font-semibold opacity-80">GRADE</span>
              <span class="text-3xl font-extrabold leading-none">${grade}</span>
            </div>
            <div class="min-w-0">
              <div class="text-sm font-bold text-slate-900 truncate">${state.deviceInfo.model}</div>
              <div class="text-xs text-slate-500">${state.deviceInfo.os} ${state.deviceInfo.osVersion} ${state.manualImeiOrSerial ? '• ' + escapeHtml(state.manualImeiOrSerial) : ''}</div>
              <div class="text-xs font-semibold mt-1 text-slate-700">
                <span class="text-emerald-700">PASS ${counts.pass}</span> •
                <span class="text-rose-700">FAIL ${counts.fail}</span> •
                <span class="text-slate-500">SKIP/NA ${counts.skip}</span>
              </div>
            </div>
          </div>

          <!-- 6-Digit Online Code Card -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 text-center space-y-2">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500">โค้ดดึงผล 6 หลัก (Online Code)</div>
            ${sync.loading
              ? `<div class="py-3 text-sm font-semibold text-blue-600 animate-pulse">กำลังซิงก์ผลตรวจขึ้นเซิร์ฟเวอร์...</div>`
              : sync.code
                ? `<div class="text-4xl font-extrabold tracking-[0.2em] text-blue-700 py-1">${sync.code.slice(0, 3)} ${sync.code.slice(3)}</div>`
                : `<div class="text-xs text-slate-500">${sync.error || 'โหมดออฟไลน์ — สแกน QR ด้านล่างได้ทันที'}</div>
                   <button id="retrySyncBtn" type="button" class="mt-1 px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-50">ลองรับโค้ด 6 หลักอีกครั้ง</button>`
            }
          </div>

          <!-- Offline QR Code Card -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col items-center space-y-3">
            <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Offline QR Code (SC1 • สแกนเข้า WMS ได้ทันที)</div>
            <div id="qrCanvasWrap" class="p-3 bg-white rounded-xl border border-slate-200"></div>
            <div class="text-[11px] text-slate-500 text-center break-all">
              Session: <strong>${state.sessionId}</strong> • ${state.qrString.length} chars
            </div>
            <div class="grid grid-cols-2 gap-2 w-full">
              <button id="copyQrPayloadBtn" type="button" class="py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold">คัดลอกโค้ด SC1</button>
              <button id="copyJsonBtn" type="button" class="py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold">${t('copyJsonBtn')}</button>
            </div>
          </div>

          <button id="newCheckBtn" type="button" class="w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm">
            ${t('newCheckBtn')}
          </button>
        </div>
      `;

      // Render real QR code matrix via qrcode-generator
      const wrap = document.getElementById('qrCanvasWrap');
      if (typeof window.qrcode === 'function' && state.qrString) {
        const qr = window.qrcode(0, 'M');
        qr.addData(state.qrString);
        qr.make();
        wrap.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
        const svg = wrap.querySelector('svg');
        if (svg) {
          svg.style.width = '220px';
          svg.style.height = '220px';
        }
      } else {
        wrap.innerHTML = `<div class="p-4 text-xs text-slate-500">QR library unavailable offline</div>`;
      }

      const retryBtn = document.getElementById('retrySyncBtn');
      if (retryBtn) retryBtn.addEventListener('click', syncSixDigitCode);

      document.getElementById('copyQrPayloadBtn').addEventListener('click', () => copyText(state.qrString));
      document.getElementById('copyJsonBtn').addEventListener('click', () => copyText(JSON.stringify(buildFullJson(), null, 2)));
      document.getElementById('newCheckBtn').addEventListener('click', () => {
        state.step = 'home';
        render();
      });
    }

    function navFooter(prevStep, nextStep, nextDisabled) {
      return `
        <div class="grid grid-cols-3 gap-2">
          <button id="navBackBtn" type="button" class="py-3.5 rounded-xl bg-slate-200 text-slate-800 font-bold text-sm">${t('backBtn')}</button>
          <button id="navNextBtn" type="button" ${nextDisabled ? 'disabled' : ''} class="col-span-2 py-3.5 rounded-xl bg-blue-600 text-white font-bold text-sm disabled:opacity-40">${t('nextBtn')} →</button>
        </div>
      `;
    }

    function bindNavFooter(prevStep, nextStep, beforeLeave) {
      document.getElementById('navBackBtn').addEventListener('click', () => {
        if (beforeLeave) beforeLeave();
        state.step = prevStep;
        render();
      });
      document.getElementById('navNextBtn').addEventListener('click', () => {
        if (beforeLeave) beforeLeave();
        state.step = nextStep;
        render();
      });
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(t('copiedToast'))).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      showToast(t('copiedToast'));
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Global header controls
    document.getElementById('langToggleBtn').addEventListener('click', () => {
      state.lang = state.lang === 'th' ? 'en' : 'th';
      document.getElementById('settingsTitle').textContent = t('settingsTitle');
      render();
    });

    const modal = document.getElementById('settingsModal');
    const webhookInput = document.getElementById('webhookInput');
    document.getElementById('settingsBtn').addEventListener('click', () => {
      webhookInput.value = state.webhookUrl;
      modal.classList.remove('hidden');
    });
    document.getElementById('closeSettingsBtn').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('cancelSettingsBtn').addEventListener('click', () => modal.classList.add('hidden'));
    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
      state.webhookUrl = webhookInput.value.trim();
      try { localStorage.setItem('smartcheck_webhook_url', state.webhookUrl); } catch (_) {}
      modal.classList.add('hidden');
      showToast(t('savedToast'));
      render();
    });

    render();
  </script>
</body>
</html>
